<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Counter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5; /* Changed background color */
      }
      .container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
        color: #333333; /* Changed text color */
      }
      form {
        text-align: center;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007bff; /* Changed button color */
        color: #ffffff; /* Changed text color */
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background-color: #0056b3; /* Darker shade on hover */
      }
      #result {
        margin-top: 20px;
        text-align: center;
        color: #555555; /* Changed text color */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Exercise Counter</h1>
      <form id="exerciseForm">
        <label for="exerciseSelect">Select Exercise:</label>
        <select id="exerciseSelect" name="exercise">
          <option value="reps">Reps</option>
          <option value="squats">Squats</option>
          <option value="pushups">Pushups</option>
        </select>
        <button type="submit">Count</button>
      </form>
      <div id="result"></div>
    </div>

    <script>
      document
        .getElementById("exerciseForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          var formData = new FormData(this);
          fetch("/count_exercise", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify(Object.fromEntries(formData)),
          })
            .then((response) => response.json())
            .then((data) => {
              document.getElementById("result").innerHTML =
                "Count: " + data.count;
            })
            .catch((error) => {
              console.error("Error:", error);
              document.getElementById("result").innerHTML =
                "Error: " + error.message;
            });
        });
    </script>
  </body>
</html>
